<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockScans — US Stock Scanner</title>
    <meta name="description"
        content="Professional US equity scanner powered by StockScans. Scan 3,100+ stocks for technical setups in real-time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        /* ── Design Tokens ─────────────────────────────────────── */
        :root {
            --bg: #080b12;
            --surface: #0e1320;
            --card: #131926;
            --card-hover: #182033;
            --border: #1e2a40;
            --border-light: #253350;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.25);
            --accent-hover: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
            --muted: #4b5878;
            --text-primary: #e8edf5;
            --text-secondary: #8fa3c0;
            --text-muted: #4b5878;
            --sidebar-w: 280px;
            --header-h: 60px;
            --radius: 10px;
            --radius-sm: 6px;
            --transition: all 0.18s ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ────────────────────────────────────────────── */
        .app-header {
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            flex-shrink: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .logo span {
            font-weight: 400;
            opacity: 0.7;
        }

        .header-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 6px var(--green);
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 12px var(--green);
            }
        }

        .header-meta {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .header-meta strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .last-updated-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ── Layout ─────────────────────────────────────────────── */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ─────────────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        .sidebar-section {
            padding: 20px 12px 8px;
        }

        .sidebar-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 8px;
            margin-bottom: 6px;
        }

        .scanner-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.83rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            gap: 8px;
        }

        .scanner-btn:hover {
            background: var(--card-hover);
            color: var(--text-primary);
        }

        .scanner-btn.active {
            background: var(--accent-glow);
            color: #93c5fd;
            font-weight: 600;
            border: 1px solid rgba(37, 99, 235, 0.35);
        }

        .scanner-btn .btn-label {
            flex: 1;
        }

        .count-badge {
            font-size: 0.7rem;
            font-weight: 700;
            background: var(--border);
            color: var(--text-muted);
            border-radius: 20px;
            padding: 1px 7px;
            transition: var(--transition);
            min-width: 22px;
            text-align: center;
        }

        .scanner-btn.active .count-badge {
            background: rgba(37, 99, 235, 0.4);
            color: #93c5fd;
        }

        /* ── Main Content ─────────────────────────────────────── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Results Header Bar ──────────────────────────────── */
        .results-header {
            height: 52px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .results-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .results-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .results-count-pill {
            background: var(--accent);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            border-radius: 20px;
            padding: 2px 8px;
        }

        .sort-controls {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sort-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .sort-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }

        .sort-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .sort-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ── Chart Grid ──────────────────────────────────────── */
        .grid-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .grid-area::-webkit-scrollbar {
            width: 6px;
        }

        .grid-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid-area::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 1400px;
        }

        @media (max-width: 1024px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Chart Card ──────────────────────────────────────── */
        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chart-card:hover {
            border-color: var(--border-light);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-ticker {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .card-ticker a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.15s;
        }

        .card-ticker a:hover {
            color: #60a5fa;
        }

        .card-stage-pill {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pill-stage2 {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .pill-gap-up {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .pill-gap-dn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .card-metrics {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .metric-chip {
            font-size: 0.68rem;
            font-weight: 600;
            background: var(--border);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .metric-chip.highlight {
            color: #60a5fa;
            background: rgba(37, 99, 235, 0.15);
        }

        .metric-chip.positive {
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
        }

        .metric-chip.negative {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        .chart-container {
            height: 380px;
            width: 100%;
        }

        /* ── Skeleton Loader ─────────────────────────────────── */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 1400px;
        }

        @media (max-width: 1024px) {
            .skeleton-grid {
                grid-template-columns: 1fr;
            }
        }

        .skeleton-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .skeleton-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skel {
            background: linear-gradient(90deg, var(--border) 25%, var(--border-light) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skel-ticker {
            width: 60px;
            height: 18px;
        }

        .skel-pill {
            width: 48px;
            height: 16px;
            border-radius: 20px;
        }

        .skel-chip {
            height: 20px;
        }

        .skel-chart {
            height: 380px;
        }

        /* ── Empty State ─────────────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 320px;
            color: var(--text-muted);
            gap: 12px;
        }

        .empty-icon {
            font-size: 2.5rem;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-sub {
            font-size: 0.8rem;
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        /* ── Welcome State ───────────────────────────────────── */
        .welcome-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 3rem;
            opacity: 0.35;
        }

        .welcome-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .welcome-sub {
            font-size: 0.85rem;
            max-width: 340px;
            line-height: 1.6;
        }

        .welcome-footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.6);
            letter-spacing: 0.5px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.5);
            text-align: center;
            border-top: 1px solid var(--border);
        }

        /* ── Universe Table ─────────────────────────────────── */
        .universe-table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .universe-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: right;
        }

        .universe-table th,
        .universe-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .universe-table th {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .universe-table th:hover {
            color: var(--text-primary);
            background: rgba(30, 41, 59, 0.8);
        }

        .universe-table th[data-ksort]:not([data-ksort="ticker"])::after {
            content: "⇅";
            margin-left: 4px;
            opacity: 0.3;
        }

        .universe-table th[data-ksort="ticker"] {
            text-align: left;
        }

        .universe-table td:first-child {
            text-align: left;
        }

        .universe-table th.sort-asc::after {
            content: "↑";
            opacity: 1;
            color: var(--accent);
        }

        .universe-table th.sort-desc::after {
            content: "↓";
            opacity: 1;
            color: var(--accent);
        }

        .universe-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .pct-pos {
            color: #4ade80;
        }

        .pct-neg {
            color: #f87171;
        }

        .pct-neutral {
            color: var(--text-muted);
        }

        .theme-up {
            color: #4ade80;
            font-size: 0.75rem;
            margin-left: 3px;
            font-weight: 600;
        }

        .theme-dn {
            color: #f87171;
            font-size: 0.75rem;
            margin-left: 3px;
            font-weight: 600;
        }

        .theme-flat {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-left: 3px;
        }

        /* ── Filter Bar ─────────────────────────────── */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 0;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }

        .filter-bar .filter-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-bar label {
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .filter-bar select,
        .filter-bar input[type="number"] {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 0.78rem;
            width: 80px;
            outline: none;
        }

        .filter-bar select {
            width: 100px;
            cursor: pointer;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--accent);
        }

        .filter-bar .filter-apply-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .filter-bar .filter-apply-btn:hover {
            background: #818cf8;
        }

        .filter-bar .filter-clear-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: color 0.15s;
        }

        .filter-bar .filter-clear-btn:hover {
            color: var(--text-primary);
        }

        .sort-buttons {
            display: flex;
            gap: 6px;
        }

        .sort-select {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 0.78rem;
            outline: none;
            cursor: pointer;
        }

        /* ── Drill-Down Styles ─────────────────────────── */
        .theme-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0 8px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .theme-section-header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .universe-table tr.clickable-row {
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .universe-table tr.clickable-row:hover {
            background: rgba(99, 102, 241, 0.08) !important;
        }

        .universe-table tr.clickable-row:active {
            transform: scale(0.995);
        }

        .rank-badge {
            display: inline-block;
            min-width: 28px;
            text-align: center;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .rank-top {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .rank-mid {
            background: rgba(250, 204, 21, 0.1);
            color: #facc15;
        }

        .rank-low {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
        }

        .breadcrumb-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .breadcrumb-bar .bc-link {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        .breadcrumb-bar .bc-link:hover {
            text-decoration: underline;
        }

        .breadcrumb-bar .bc-sep {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .breadcrumb-bar .bc-current {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ── Mobile Menu Elements (Hidden by default) ───────── */
        .menu-toggle,
        .mobile-close-btn {
            display: none;
        }

        .sidebar-overlay {
            display: none;
        }

        /* ── Mobile Layout ──────────────────────────────────── */
        @media (max-width: 768px) {
            .app-body {
                flex-direction: column;
            }

            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: var(--text-primary);
                cursor: pointer;
                padding: 4px;
                flex-shrink: 0;
            }

            .mobile-close-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: var(--text-primary);
                cursor: pointer;
                position: absolute;
                top: 20px;
                right: 20px;
                padding: 8px;
                border-radius: 50%;
                background: var(--surface);
                border: 1px solid var(--border);
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(2px);
                z-index: 990;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
            }

            .sidebar-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: -300px;
                /* Hide off-canvas */
                width: 280px;
                height: 100vh;
                z-index: 1000;
                background: var(--bg);
                border-right: 1px solid var(--border);
                flex-direction: column;
                padding: 24px;
                gap: 32px;
                overflow-y: auto;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .sidebar.open {
                left: 0;
                /* Slide in */
            }

            .sidebar::-webkit-scrollbar {
                display: none;
            }

            .sidebar-section {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .sidebar-section-label {
                display: block;
                /* Restore category labels for vertical layout */
            }

            .scanner-btn {
                width: 100%;
                white-space: normal;
                padding: 10px 14px;
                border-radius: 8px;
                background: transparent;
                border: 1px solid transparent;
                font-size: 0.9rem;
                justify-content: flex-start;
            }

            .scanner-btn:hover {
                background: var(--card-hover);
            }

            .scanner-btn.active {
                background: var(--accent-glow);
                border-color: rgba(37, 99, 235, 0.4);
            }

            .scanner-btn .count-badge {
                margin-left: 6px;
            }

            .sidebar-footer {
                display: none;
            }

            /* Main Header adjustments */
            .app-header {
                padding: 0 16px;
            }

            .last-updated-label {
                display: none;
                /* Hide date text to save space */
            }

            .logo {
                font-size: 1.1rem;
            }

            /* Results area headers */
            .results-header {
                flex-direction: column;
                height: auto;
                padding: 12px 16px;
                gap: 12px;
                align-items: flex-start;
            }

            .sort-controls {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 8px;
            }

            .sort-buttons {
                display: none;
                /* Hide buttons on mobile */
            }

            .sort-select {
                display: block;
                /* Show dropdown on mobile */
            }

            .filter-bar {
                width: 100%;
                justify-content: flex-start;
            }
        }

        .sort-btn {
            white-space: nowrap;
        }

        /* Grid adjustments */
        .grid-area {
            padding: 12px;
        }

        .chart-grid {
            gap: 12px;
        }

        .card-header {
            padding: 10px 12px;
        }

        .card-stats {
            padding: 8px 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .card-stats::-webkit-scrollbar {
            display: none;
        }

        .skel-chart,
        .tradingview-widget-container {
            height: 320px !important;
            /* Slightly shorter charts on mobile */
        }
        }
    </style>
</head>

<body>

    <!-- Mobile Sidebar Overlay (hidden by default) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileMenu()"></div>

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="app-header">
        <button class="menu-toggle" onclick="toggleMobileMenu()" title="Open Filters">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="logo">Stock<span>Scans</span></div>
        <div class="header-divider"></div>
        <div class="live-dot"></div>
        <div class="header-meta">
            Scanning <strong id="universe-count">—</strong> US Equities
        </div>
        <div class="header-right">
            <span class="last-updated-label">Data as of: <strong id="last-updated">—</strong></span>
        </div>
    </header>

    <!-- ── App Body ───────────────────────────────────────── -->
    <div class="app-body">

        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <button class="mobile-close-btn" onclick="toggleMobileMenu()" title="Close Filters">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div style="margin-bottom: 8px;">
                <button class="scanner-btn" id="btn-universe" onclick="runUniverse()">
                    <span class="btn-label" style="font-weight: 600; color: #fff;">🌍 Stock Universe</span>
                </button>
                <div style="height: 4px;"></div>
                <button class="scanner-btn" id="btn-themes-sector" onclick="runThemes('Sector')">
                    <span class="btn-label" style="font-weight: 600; color: #fff;">📊 Sector Ranks</span>
                </button>
                <div style="height: 4px;"></div>
                <button class="scanner-btn" id="btn-themes-industry" onclick="runThemes('Industry')">
                    <span class="btn-label" style="font-weight: 600; color: #fff;">🏭 Industry Ranks</span>
                </button>
            </div>
            <div id="sidebar-content">
                <!-- Populated dynamically from /api/v1/scanners -->
                <div style="padding: 40px 20px; text-align:center; color: var(--text-muted); font-size:0.8rem;">
                    Loading scanners…
                </div>
            </div>
            <div class="sidebar-footer">
                Built with ❤️ by Hrishikesh
            </div>
        </nav>

        <!-- Main Area -->
        <div class="main-content">

            <!-- Results Header -->
            <div class="results-header">
                <div class="results-title" id="results-title">Select a scanner</div>
                <div class="results-meta" id="results-meta"></div>
            </div>
            <div class="control-bars-container"
                style="padding: 0 20px 10px 20px; border-bottom: 1px solid var(--border);">
                <div class="sort-controls" id="sort-controls" style="display:none">
                    <span class="sort-label">Sort:</span>
                    <div class="sort-buttons">
                        <button class="sort-btn active" data-sort="rs_rating">RS Rating</button>
                        <button class="sort-btn" data-sort="rvol">RVOL</button>
                        <button class="sort-btn" data-sort="close">Price</button>
                        <button class="sort-btn" data-sort="pct_from_52w_high">Near High</button>
                        <button class="sort-btn" data-sort="momentum_1m">Momentum</button>
                    </div>
                    <select class="sort-select" id="sort-select">
                        <option value="rs_rating">RS Rating</option>
                        <option value="rvol">RVOL</option>
                        <option value="close">Price</option>
                        <option value="pct_from_52w_high">Near High</option>
                        <option value="momentum_1m">Momentum</option>
                    </select>
                </div>
                <div class="filter-bar" id="filter-bar" style="display:none">
                    <span class="sort-label">≡ Filters:</span>
                    <div class="filter-group">
                        <label>Mkt Cap ≥</label>
                        <select id="f-mcap">
                            <option value="">Any</option>
                            <option value="300000000">$300M+</option>
                            <option value="1000000000">$1B+</option>
                            <option value="10000000000">$10B+</option>
                            <option value="50000000000">$50B+</option>
                            <option value="200000000000">$200B+</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>ADR%</label>
                        <input type="number" id="f-adr-min" placeholder="min" step="0.5" min="0">
                        <span style="color:var(--text-muted)">-</span>
                        <input type="number" id="f-adr-max" placeholder="max" step="0.5" min="0">
                    </div>
                    <div class="filter-group">
                        <label>Price ≥</label>
                        <input type="number" id="f-price" placeholder="$" step="1" min="0" style="width:60px">
                    </div>
                    <button class="filter-apply-btn" onclick="applyFilters()">Apply</button>
                    <button class="filter-clear-btn" onclick="clearFilters()">Clear</button>
                </div>
            </div>

            <!-- Grid Area -->
            <div class="grid-area" id="grid-area">
                <div class="welcome-state">
                    <div class="welcome-icon">📊</div>
                    <div class="welcome-title">StockScans Full Engine</div>
                    <div class="welcome-sub">
                        Choose a scanner from the left panel to scan 3,100+ US equities for technical setups.
                    </div>
                    <div class="welcome-footer">
                        Built with ❤️ by Hrishikesh
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ── Config ──────────────────────────────────────────────
        const API = '/api/v1';

        // ── State ───────────────────────────────────────────────
        let activeScanner = null;
        let activeSortBy = 'rs_rating';
        let lastResults = [];      // cached for client-side resort
        let tvWidgetCount = 0;

        // Themes Engine State
        let themesData = [];
        let themesSortBy = 'rank_1m';
        let themesSortDir = 1;
        let sectorIndustryMap = {};
        let themesLevel = 'top';     // 'top' | 'industries' | 'stocks'
        let selectedSector = null;
        let selectedIndustry = null;
        let themesCategory = 'Sector'; // 'Sector' or 'Industry'
        let themeStockData = [];       // cached stock data for resort

        // ── Utility ─────────────────────────────────────────────
        function fmt(val, decimals = 1, suffix = '') {
            if (val == null || isNaN(val)) return '—';
            return val.toFixed(decimals) + suffix;
        }

        function fmtPrice(val) {
            if (val == null || isNaN(val)) return '—';
            return '$' + val.toFixed(2);
        }

        // ── Mobile Menu Toggle ───────────────────────────────────
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            }
        }

        // ── Boot ─────────────────────────────────────────────────
        async function boot() {
            try {
                const [healthRes, scannersRes] = await Promise.all([
                    fetch(`${API}/health`),
                    fetch(`${API}/scanners`),
                ]);
                const health = await healthRes.json();
                const scanData = await scannersRes.json();

                document.getElementById('universe-count').textContent =
                    health.universe_size.toLocaleString();
                document.getElementById('last-updated').textContent =
                    health.last_updated || '—';

                buildSidebar(scanData.scanners);
            } catch (err) {
                console.error('Boot failed:', err);
            }
        }

        // ── Sidebar Builder ──────────────────────────────────────
        function buildSidebar(scanners) {
            // Group by category
            const categories = {};
            for (const s of scanners) {
                if (!categories[s.category]) categories[s.category] = [];
                categories[s.category].push(s);
            }

            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';

            for (const [cat, items] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = 'sidebar-section';
                section.innerHTML = `<div class="sidebar-section-label">${cat}</div>`;

                for (const item of items) {
                    const btn = document.createElement('button');
                    btn.className = 'scanner-btn';
                    btn.dataset.id = item.id;
                    btn.title = item.description;
                    btn.innerHTML = `
            <span class="btn-label">${item.label}</span>
            <span class="count-badge" id="badge-${item.id}">—</span>
          `;
                    btn.addEventListener('click', () => runScanner(item.id, item.label));
                    section.appendChild(btn);
                }

                container.appendChild(section);
            }

            // Preload badges in background
            prefetchBadges(scanners);

            // Auto-run scanner from URL query param (handles page refresh + shared links)
            const urlScannerId = new URLSearchParams(window.location.search).get('scanner');
            if (urlScannerId) {
                // Handle special pages
                if (urlScannerId === 'universe') {
                    runUniverse();
                } else if (urlScannerId === 'themes-sector') {
                    runThemes('Sector');
                } else if (urlScannerId === 'themes-industry') {
                    runThemes('Industry');
                } else {
                    const btn = document.querySelector(`.scanner-btn[data-id="${urlScannerId}"]`);
                    const label = btn?.querySelector('.btn-label')?.textContent || urlScannerId;
                    runScanner(urlScannerId, label);
                }
            }
        }

        async function prefetchBadges(scanners) {
            const todayKey = new Date().toISOString().slice(0, 10);
            const cacheKey = 'badge_cache';
            let badgeCache = {};

            // Try to load from localStorage
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed._cacheDate === todayKey) {
                        badgeCache = parsed;
                        // Restore badges from cache instantly
                        for (const s of scanners) {
                            const badge = document.getElementById(`badge-${s.id}`);
                            if (badge && badgeCache[s.id] != null) badge.textContent = badgeCache[s.id];
                        }
                        return; // All badges restored from cache, no DB calls needed
                    }
                }
            } catch (_) { }

            // Cache miss or stale — fetch from API
            for (const s of scanners) {
                try {
                    const res = await fetch(`${API}/scan/${s.id}?limit=5000`);
                    const data = await res.json();
                    const badge = document.getElementById(`badge-${s.id}`);
                    if (badge) badge.textContent = data.count;
                    badgeCache[s.id] = data.count;
                } catch (_) { /* ignore */ }
                await sleep(80);
            }
            // Save to localStorage
            badgeCache._cacheDate = todayKey;
            try { localStorage.setItem(cacheKey, JSON.stringify(badgeCache)); } catch (_) { }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // ── Sort Controls ────────────────────────────────────────
        document.getElementById('sort-controls').addEventListener('click', e => {
            const btn = e.target.closest('.sort-btn');
            if (!btn) return;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeSortBy = btn.dataset.sort;
            document.getElementById('sort-select').value = activeSortBy;
            executeSort();
        });

        document.getElementById('sort-select')?.addEventListener('change', e => {
            activeSortBy = e.target.value;
            document.querySelectorAll('.sort-btn').forEach(b => {
                if (b.dataset.sort === activeSortBy) b.classList.add('active');
                else b.classList.remove('active');
            });
            executeSort();
        });

        function executeSort() {
            if (themesLevel === 'stocks' && themeStockData.length) {
                renderThemeStocksGrid(themeStockData, selectedIndustry || selectedSector);
                return;
            }
            if (lastResults.length) renderGrid(sortResults(lastResults));
        }

        function sortResults(results) {
            return [...results].sort((a, b) => {
                const aVal = a[activeSortBy] ?? -Infinity;
                const bVal = b[activeSortBy] ?? -Infinity;
                if (activeSortBy === 'pct_from_52w_high') return aVal - bVal;
                return bVal - aVal;
            });
        }

        // ── Filter Controls ──────────────────────────────────────
        function buildFilterParams() {
            let p = '';
            const mcap = document.getElementById('f-mcap')?.value;
            const adrMin = document.getElementById('f-adr-min')?.value;
            const adrMax = document.getElementById('f-adr-max')?.value;
            const price = document.getElementById('f-price')?.value;
            if (mcap) p += `&min_market_cap=${mcap}`;
            if (adrMin) p += `&min_adr=${adrMin}`;
            if (adrMax) p += `&max_adr=${adrMax}`;
            if (price) p += `&min_price=${price}`;
            return p;
        }

        function applyFilters() {
            if (activeScanner) {
                const btn = document.querySelector(`.scanner-btn[data-id="${activeScanner}"]`);
                const label = btn?.querySelector('.btn-label')?.textContent || activeScanner;
                runScanner(activeScanner, label, true); // force re-fetch
            }
        }

        function clearFilters() {
            document.getElementById('f-mcap').value = '';
            document.getElementById('f-adr-min').value = '';
            document.getElementById('f-adr-max').value = '';
            document.getElementById('f-price').value = '';
            applyFilters();
        }

        // ── URL Routing ──────────────────────────────────────────
        // Push scanner into the browser history so the URL reflects the active scan.
        function pushScannerToHistory(scannerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('scanner', scannerId);
            history.pushState({ scanner: scannerId }, '', url.toString());
        }

        // Back/Forward: sync the UI to whichever scanner the history state points to.
        window.addEventListener('popstate', (e) => {
            const scannerId = e.state?.scanner || new URLSearchParams(window.location.search).get('scanner');
            if (scannerId === 'universe') {
                runUniverse();
            } else if (scannerId) {
                const btn = document.querySelector(`.scanner-btn[data-id="${scannerId}"]`);
                const label = btn?.querySelector('.btn-label')?.textContent || scannerId;
                runScanner(scannerId, label, /* force= */ true);
            }
        });

        // ── Run Scanner ──────────────────────────────────────────
        async function runScanner(scannerId, scannerLabel, force = false) {
            if (!force && activeScanner === scannerId) return;
            activeScanner = scannerId;

            // Reflect the active scanner in the URL (only on user clicks, not on popstate)
            if (!force) pushScannerToHistory(scannerId);

            // Update sidebar active state
            document.querySelectorAll('.scanner-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.scanner-btn[data-id="${scannerId}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            // Update header
            document.getElementById('results-title').textContent = scannerLabel;

            // Auto-close mobile menu when a scanner is selected
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                toggleMobileMenu();
            }
            document.getElementById('results-meta').innerHTML = '';
            document.getElementById('sort-controls').style.display = 'none';
            document.getElementById('filter-bar').style.display = 'none';

            // Show skeleton
            showSkeletons(6);

            try {
                const t0 = performance.now();
                const filterParams = buildFilterParams();
                const res = await fetch(`${API}/scan/${scannerId}?limit=5000&sort_by=${activeSortBy}&order=desc${filterParams}`);
                if (!res.ok) throw new Error(`API ${res.status}`);

                const data = await res.json();
                const ms = Math.round(performance.now() - t0);
                lastResults = data.data;

                updateResultsMeta(data, ms);
                document.getElementById('sort-controls').style.display = 'flex';
                document.getElementById('filter-bar').style.display = 'flex';

                if (lastResults.length === 0) {
                    showEmptyState(scannerLabel);
                } else {
                    renderGrid(sortResults(lastResults));
                }

                // Update badge
                const badge = document.getElementById(`badge-${scannerId}`);
                if (badge) badge.textContent = data.count;

            } catch (err) {
                console.error(err);
                document.getElementById('grid-area').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">Scanner Error</div>
            <div class="empty-sub">${err.message}</div>
          </div>`;
            }
        }

        function updateResultsMeta(data, ms) {
            document.getElementById('results-meta').innerHTML = `
        <span class="results-count-pill">${data.count} results</span>
        <span>from ${(data.total_universe || 0).toLocaleString()} stocks</span>
        <span style="color:var(--text-muted)">· ${ms}ms</span>
      `;
        }

        // ── Skeleton Loader ──────────────────────────────────────
        function showSkeletons(n) {
            const area = document.getElementById('grid-area');
            const grid = document.createElement('div');
            grid.className = 'skeleton-grid';

            for (let i = 0; i < n; i++) {
                grid.innerHTML += `
          <div class="skeleton-card">
            <div class="skeleton-header">
              <div class="skel skel-ticker"></div>
              <div class="skel skel-pill"></div>
              <div style="margin-left:auto;display:flex;gap:6px">
                <div class="skel skel-chip" style="width:52px"></div>
                <div class="skel skel-chip" style="width:52px"></div>
                <div class="skel skel-chip" style="width:52px"></div>
              </div>
            </div>
            <div class="skel skel-chart"></div>
          </div>`;
            }
            area.innerHTML = '';
            area.appendChild(grid);
        }

        // ── Empty State ──────────────────────────────────────────
        function showEmptyState(label) {
            document.getElementById('grid-area').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">No results found</div>
          <div class="empty-sub">
            The <strong>${label}</strong> scanner found no matching setups in today's data.
            Try running <code>ingest.py</code> to refresh the database.
          </div>
        </div>`;
        }

        // ── Render Grid ──────────────────────────────────────────
        function renderGrid(stocks) {
            const area = document.getElementById('grid-area');
            const grid = document.createElement('div');
            grid.className = 'chart-grid';
            area.innerHTML = '';
            area.appendChild(grid);

            for (const stock of stocks) {
                createChartCard(stock, grid);
            }
        }

        // ── Chart Card ───────────────────────────────────────────
        function createChartCard(stock, grid) {
            const containerId = `tv-${(stock.ticker || '').replace(/[^a-zA-Z0-9]/g, '')}-${++tvWidgetCount}`;

            const rs = fmt(stock.rs_rating);
            const rvol = fmt(stock.rvol, 2);
            const mom_1y = fmt(stock.momentum_1y != null ? stock.momentum_1y * 100 : null, 1, '%');
            const w52 = fmt(stock.pct_from_52w_high, 1, '%');
            const mom_1m = fmt(stock.momentum_1m != null ? stock.momentum_1m * 100 : null, 1, '%');
            const mom_1d = fmt(stock.momentum_1d != null ? stock.momentum_1d * 100 : null, 1, '%');
            const price = fmtPrice(stock.close);

            const rsClass = stock.rs_rating >= 90 ? 'positive' : stock.rs_rating >= 70 ? 'highlight' : '';
            const rvolClass = stock.rvol >= 2 ? 'positive' : '';
            const mom1yClass = stock.momentum_1y > 0 ? 'positive' : stock.momentum_1y < 0 ? 'negative' : '';
            const w52Class = stock.pct_from_52w_high >= -5 ? 'positive' : '';
            const mom1mClass = stock.momentum_1m > 0 ? 'positive' : stock.momentum_1m < 0 ? 'negative' : '';
            const mom1dClass = stock.momentum_1d > 0 ? 'positive' : stock.momentum_1d < 0 ? 'negative' : '';

            const stagePill = stock.in_stage_2
                ? '<span class="card-stage-pill pill-stage2">Stage 2</span>'
                : stock.gap_up
                    ? '<span class="card-stage-pill pill-gap-up">Gap Up</span>'
                    : stock.gap_down
                        ? '<span class="card-stage-pill pill-gap-dn">Gap Dn</span>'
                        : '';

            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `
        <div class="card-header">
          <div class="card-ticker">
            <a href="https://www.tradingview.com/chart/?symbol=${stock.ticker}"
               target="_blank" rel="noopener noreferrer" title="Open on TradingView">
              ${stock.ticker}
            </a>
          </div>
          ${stagePill}
          <div class="card-metrics">
            <span class="metric-chip ${rsClass}">RS&nbsp;${rs}</span>
            <span class="metric-chip ${rvolClass}">RVOL&nbsp;${rvol}</span>
            <span class="metric-chip ${mom1yClass}">52W&nbsp;${mom_1y}</span>
            <span class="metric-chip ${w52Class}">vs Hi&nbsp;${w52}</span>
            <span class="metric-chip ${mom1mClass}">1M&nbsp;${mom_1m}</span>
            <span class="metric-chip ${mom1dClass}">1D&nbsp;${mom_1d}</span>
            <span class="metric-chip">${price}</span>
          </div>
        </div>
        <div class="chart-container" id="${containerId}"></div>
      `;

            grid.appendChild(card);

            // Lazy-load TradingView widget on intersection
            const obs = new IntersectionObserver((entries, o) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    try {
                        new TradingView.widget({
                            autosize: true,
                            symbol: stock.ticker,
                            interval: 'D',
                            timezone: 'Etc/UTC',
                            theme: 'dark',
                            style: '1',
                            locale: 'en',
                            enable_publishing: false,
                            hide_top_toolbar: true,
                            hide_legend: true,
                            save_image: false,
                            container_id: containerId,
                            backgroundColor: '#131926',
                            gridColor: '#1e2a40',
                            studies: [
                                { id: "MAExp@tv-basicstudies", inputs: { length: 9 } }
                            ]
                        });
                    } catch (err) {
                        console.error(`TradingView widget error for ${stock.ticker}:`, err);
                        const el = document.getElementById(containerId);
                        if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#f87171">Chart failed to load</div>';
                    }
                    o.unobserve(entry.target);
                });
            }, { rootMargin: '120px' });

            obs.observe(card);
        }

        // ── Stock Universe Page ──────────────────────────────────
        let universeData = [];
        let universeSortBy = 'momentum_1m';
        let universeSortDir = -1; // -1 for desc, 1 for asc
        let universePage = 1;
        const UNIVERSE_PAGE_SIZE = 100;

        async function runUniverse() {
            if (activeScanner === 'universe') return;
            activeScanner = 'universe';
            universePage = 1; // Reset to page 1 on fresh load
            pushScannerToHistory('universe');

            // Update UI state
            document.querySelectorAll('.scanner-btn').forEach(b => b.classList.remove('active'));
            const btnUni = document.getElementById('btn-universe');
            if (btnUni) btnUni.classList.add('active');

            document.getElementById('results-title').textContent = "Stock Universe Explorer";
            document.getElementById('results-meta').innerHTML = "Full market performance across all timeframes. Click headers to sort.";
            document.getElementById('sort-controls').style.display = 'none';
            document.getElementById('filter-bar').style.display = 'none';

            // Auto-close mobile menu
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) toggleMobileMenu();

            const area = document.getElementById('grid-area');
            area.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; height:300px;">
                    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
                    <div style="color:var(--text-secondary);font-size:0.9rem;">Loading all stocks...</div>
                </div>
            `;

            try {
                const res = await fetch(`${API}/universe`);
                const json = await res.json();
                universeData = json.data;
                renderUniverseTable();
            } catch (err) {
                console.error(err);
                area.innerHTML = `<div style="padding:40px;text-align:center;color:#ef4444;">Failed to load universe</div>`;
            }
        }

        function renderUniverseTable() {
            const area = document.getElementById('grid-area');

            // Sort data memory-side (O(N log N) is ~1ms for 3000 rows in JS)
            universeData.sort((a, b) => {
                let valA = a[universeSortBy];
                let valB = b[universeSortBy];
                if (valA == null) valA = -Infinity;
                if (valB == null) valB = -Infinity;
                if (universeSortBy === 'ticker') {
                    if (a.ticker < b.ticker) return -1 * universeSortDir;
                    if (a.ticker > b.ticker) return 1 * universeSortDir;
                    return 0;
                }
                return (valA - valB) * universeSortDir;
            });

            // Build table HTML as a string
            let html = `
            <div class="universe-table-wrapper">
                <table class="universe-table">
                    <thead>
                        <tr>
                            <th data-ksort="ticker">Ticker</th>
                            <th data-ksort="close">Price</th>
                            <th data-ksort="momentum_1d">1D</th>
                            <th data-ksort="momentum_1w">1W</th>
                            <th data-ksort="momentum_1m">1M</th>
                            <th data-ksort="momentum_3m">3M</th>
                            <th data-ksort="momentum_6m">6M</th>
                            <th data-ksort="momentum_1y">1Y</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            const fmtPct = (val) => {
                if (val == null || isNaN(val) || val === 0) return '<span class="pct-neutral">—</span>';
                const pct = (val * 100).toFixed(1);
                if (val > 0) return `<span class="pct-pos">+${pct}%</span>`;
                if (val < 0) return `<span class="pct-neg">${pct}</span>`; // already has minus sign
                return `<span class="pct-neutral">${pct}%</span>`;
            };

            const totalPages = Math.ceil(universeData.length / UNIVERSE_PAGE_SIZE);
            if (universePage > totalPages) universePage = totalPages || 1;

            const startIdx = (universePage - 1) * UNIVERSE_PAGE_SIZE;
            const endIdx = startIdx + UNIVERSE_PAGE_SIZE;
            const pageData = universeData.slice(startIdx, endIdx);

            for (const row of pageData) {
                html += `
                <tr>
                    <td><a href="https://www.tradingview.com/chart/?symbol=${row.ticker}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;">${row.ticker}</a></td>
                    <td>${fmtPrice(row.close)}</td>
                    <td>${fmtPct(row.momentum_1d)}</td>
                    <td>${fmtPct(row.momentum_1w)}</td>
                    <td>${fmtPct(row.momentum_1m)}</td>
                    <td>${fmtPct(row.momentum_3m)}</td>
                    <td>${fmtPct(row.momentum_6m)}</td>
                    <td>${fmtPct(row.momentum_1y)}</td>
                </tr>
                `;
            }
            html += `</tbody></table></div>`;

            // Pagination UI
            if (totalPages > 1) {
                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding: 0 4px; flex-wrap: wrap; gap: 12px;">
                    <div style="font-size:0.85rem; color:var(--text-muted);">
                        Showing ${startIdx + 1}–${Math.min(endIdx, universeData.length)} of ${universeData.toLocaleString()} stocks
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="sort-btn" onclick="changeUniversePage(-1)" ${universePage === 1 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>&laquo; Prev</button>
                        <span style="display:flex; align-items:center; font-size:0.85rem; padding:0 8px;">Page ${universePage} of ${totalPages}</span>
                        <button class="sort-btn" onclick="changeUniversePage(1)" ${universePage === totalPages ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>Next &raquo;</button>
                    </div>
                </div>
                `;
            }

            area.innerHTML = html;

            // Add click listeners to headers for column sorting
            area.querySelectorAll('th[data-ksort]').forEach(th => {
                const col = th.dataset.ksort;
                if (col === universeSortBy) {
                    th.classList.add(universeSortDir === 1 ? 'sort-asc' : 'sort-desc');
                }
                th.addEventListener('click', () => {
                    if (universeSortBy === col) {
                        universeSortDir *= -1; // flip direction
                    } else {
                        universeSortBy = col;
                        universeSortDir = col === 'ticker' ? 1 : -1; // default to DESC for numbers, ASC for string
                    }
                    universePage = 1; // Reset to page 1 on sort change
                    renderUniverseTable();
                });
            });
        }

        // Global pagination handler
        window.changeUniversePage = function (delta) {
            universePage += delta;
            renderUniverseTable();
            // Scroll back to top of main content wrapper
            document.querySelector('.main-content').scrollTo({ top: 0, behavior: 'smooth' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ── Themes Engine ─────────────────────────────────────────
        async function runThemes(category) {
            themesCategory = category || 'Sector';
            document.querySelectorAll('.scanner-btn').forEach(b => b.classList.remove('active'));
            const btnId = themesCategory === 'Sector' ? 'btn-themes-sector' : 'btn-themes-industry';
            document.getElementById(btnId).classList.add('active');
            activeScanner = null;
            themesLevel = 'top';
            selectedSector = null;
            selectedIndustry = null;
            themeStockData = [];

            const label = themesCategory === 'Sector' ? 'Sector Ranks' : 'Industry Ranks';
            document.getElementById('results-title').textContent = label;
            document.getElementById('results-meta').innerHTML = `<span style="color:var(--text-muted)">Tracking money flow rotation across market ${themesCategory.toLowerCase()}s</span>`;
            document.getElementById('sort-controls').style.display = 'none';
            document.getElementById('filter-bar').style.display = 'none';

            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) toggleMobileMenu();

            const area = document.getElementById('grid-area');
            area.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; height:300px;">
                    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
                    <div style="color:var(--text-secondary);font-size:0.9rem;">Loading ${label.toLowerCase()}...</div>
                </div>
            `;

            try {
                // Check localStorage cache keyed by today's date
                const todayKey = new Date().toISOString().slice(0, 10); // "2026-02-25"
                const cacheKey = 'themes_cache';
                const cached = localStorage.getItem(cacheKey);
                let json;

                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed._cacheDate === todayKey && parsed.data && parsed.data.length > 0) {
                        json = parsed;
                    }
                }

                if (!json) {
                    const res = await fetch(`${API}/themes`);
                    json = await res.json();
                    json._cacheDate = todayKey;
                    try { localStorage.setItem(cacheKey, JSON.stringify(json)); } catch (_) { }
                }

                document.getElementById('last-updated').textContent = json.as_of_date || 'Live';
                themesData = json.data;
                sectorIndustryMap = json.sector_industry_map || {};
                renderThemesView();
            } catch (err) {
                console.error(err);
                area.innerHTML = `<div style="padding:40px;text-align:center;color:#ef4444;">Failed to load thematic data</div>`;
            }
        }

        // ── Shared helpers ──
        const fmtRank = (rank, change, total) => {
            if (rank == null || rank >= 9999) return '<span class="pct-neutral">—</span>';
            const q = total > 0 ? rank / total : 0.5;
            const cls = q <= 0.25 ? 'rank-top' : q <= 0.6 ? 'rank-mid' : 'rank-low';
            let changeHtml = '';
            if (change != null) {
                if (change > 0) changeHtml = `<span class="theme-up"> ▲${change}</span>`;
                else if (change < 0) changeHtml = `<span class="theme-dn"> ▼${Math.abs(change)}</span>`;
            }
            return `<span class="rank-badge ${cls}">${rank}</span>${changeHtml}`;
        };

        function buildRankHeaders(prefix) {
            return `
                <th data-tsort="${prefix}rank_1d" style="text-align:right;">1D</th>
                <th data-tsort="${prefix}rank_1w" style="text-align:right;">1W</th>
                <th data-tsort="${prefix}rank_1m" style="text-align:right;">1M</th>
                <th data-tsort="${prefix}rank_3m" style="text-align:right;">3M</th>
                <th data-tsort="${prefix}rank_6m" style="text-align:right;">6M</th>
                <th data-tsort="${prefix}rank_1y" style="text-align:right;">1Y</th>
            `;
        }

        function buildRankCells(row, total) {
            return `
                <td style="text-align:right;">${fmtRank(row.rank_1d, row.change_1d, total)}</td>
                <td style="text-align:right;">${fmtRank(row.rank_1w, row.change_1w, total)}</td>
                <td style="text-align:right;">${fmtRank(row.rank_1m, row.change_1m, total)}</td>
                <td style="text-align:right;">${fmtRank(row.rank_3m, row.change_3m, total)}</td>
                <td style="text-align:right;">${fmtRank(row.rank_6m, row.change_6m, total)}</td>
                <td style="text-align:right;">${fmtRank(row.rank_1y, row.change_1y, total)}</td>
            `;
        }

        function sortThemeRows(rows) {
            return [...rows].sort((a, b) => {
                let valA = a[themesSortBy], valB = b[themesSortBy];
                if (valA == null) valA = 99999; if (valB == null) valB = 99999;
                if (themesSortBy === 'name') return (a.name < b.name ? -1 : 1) * themesSortDir;
                return (valA - valB) * themesSortDir;
            });
        }

        function bindThemeSort(area, renderFn) {
            area.querySelectorAll('th[data-tsort]').forEach(th => {
                const col = th.dataset.tsort;
                if (col === themesSortBy) th.classList.add(themesSortDir === 1 ? 'sort-asc' : 'sort-desc');
                th.addEventListener('click', () => {
                    if (themesSortBy === col) { themesSortDir *= -1; }
                    else { themesSortBy = col; themesSortDir = col === 'name' ? 1 : 1; }
                    renderFn();
                });
            });
        }

        // ── Level Router ──
        function renderThemesView() {
            if (themesLevel === 'stocks') return renderThemeStocks();
            if (themesLevel === 'industries') return renderFilteredIndustries();
            renderThemesTopLevel();
        }

        // ── Level 1: Single Category Table ──
        function renderThemesTopLevel() {
            const area = document.getElementById('grid-area');
            const rows = sortThemeRows(themesData.filter(r => r.category === themesCategory));
            const icon = themesCategory === 'Sector' ? '📊' : '🏭';
            const clickFn = themesCategory === 'Sector' ? 'drillIntoSector' : 'drillIntoIndustry';

            let html = `
            <div class="theme-section-header">${icon} ${themesCategory}s <span class="badge">${rows.length}</span></div>
            <div class="universe-table-wrapper">
                <table class="universe-table">
                    <thead><tr>
                        <th data-tsort="name" width="35%">${themesCategory}</th>
                        <th data-tsort="stock_count" style="text-align:right;">Stocks</th>
                        ${buildRankHeaders('')}
                    </tr></thead>
                    <tbody>
            `;
            for (const row of rows) {
                html += `<tr class="clickable-row" onclick="${clickFn}('${row.name.replace(/'/g, "\\'")}')"><td style="font-weight:600;color:var(--text-primary);">${row.name} <span style="opacity:0.4;font-size:0.75rem;">→</span></td><td style="text-align:right;color:var(--text-secondary);">${row.stock_count}</td>${buildRankCells(row, rows.length)}</tr>`;
            }
            html += `</tbody></table></div>`;

            area.innerHTML = html;
            bindThemeSort(area, renderThemesTopLevel);
        }

        // ── Level 2: Industries in a Sector ──
        window.drillIntoSector = function (sectorName) {
            selectedSector = sectorName;
            themesLevel = 'industries';
            themesSortBy = 'rank_1m';
            themesSortDir = 1;
            renderFilteredIndustries();
            document.querySelector('.main-content').scrollTo({ top: 0, behavior: 'smooth' });
        };

        function renderFilteredIndustries() {
            const area = document.getElementById('grid-area');
            const industryNames = sectorIndustryMap[selectedSector] || [];
            const industries = sortThemeRows(
                themesData.filter(r => r.category === 'Industry' && industryNames.includes(r.name))
            );

            let html = `
            <div class="breadcrumb-bar">
                <span class="bc-link" onclick="themesLevel='top';renderThemesView();">All Sectors</span>
                <span class="bc-sep">›</span>
                <span class="bc-current">${selectedSector}</span>
            </div>
            <div class="theme-section-header">🏭 Industries in ${selectedSector} <span class="badge">${industries.length}</span></div>
            <div class="universe-table-wrapper">
                <table class="universe-table">
                    <thead><tr>
                        <th data-tsort="name" width="35%">Industry</th>
                        <th data-tsort="stock_count" style="text-align:right;">Stocks</th>
                        ${buildRankHeaders('')}
                    </tr></thead>
                    <tbody>
            `;
            for (const row of industries) {
                html += `<tr class="clickable-row" onclick="drillIntoIndustry('${row.name.replace(/'/g, "\\'")}')"><td style="font-weight:600;color:var(--text-primary);">${row.name} <span style="opacity:0.4;font-size:0.75rem;">→</span></td><td style="text-align:right;color:var(--text-secondary);">${row.stock_count}</td>${buildRankCells(row, industries.length)}</tr>`;
            }
            html += `</tbody></table></div>`;

            if (industries.length === 0) {
                html += `<div style="padding:40px;text-align:center;color:var(--text-muted);">No industries found for ${selectedSector}</div>`;
            }

            area.innerHTML = html;
            bindThemeSort(area, renderFilteredIndustries);
        }

        // ── Level 3: Stocks in an Industry or Sector ──
        window.drillIntoIndustry = async function (name) {
            selectedIndustry = name;
            themesLevel = 'stocks';
            const catType = themesCategory === 'Sector' ? 'Sector' : 'Industry';
            const catLabel = themesCategory === 'Sector' ? selectedSector || name : name;

            const area = document.getElementById('grid-area');
            area.innerHTML = `
                <div class="breadcrumb-bar">
                    ${selectedSector ? `<span class="bc-link" onclick="themesLevel='top';renderThemesView();">All Sectors</span><span class="bc-sep">›</span><span class="bc-link" onclick="drillIntoSector('${selectedSector.replace(/'/g, "\\'")}')">` + selectedSector + `</span><span class="bc-sep">›</span>` : `<span class="bc-link" onclick="themesLevel='top';renderThemesView();">All ${themesCategory}s</span><span class="bc-sep">›</span>`}
                    <span class="bc-current">${name}</span>
                </div>
                <div style="display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; height:250px;">
                    <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
                    <div style="color:var(--text-secondary);font-size:0.9rem;">Loading stocks in ${name}...</div>
                </div>
            `;

            try {
                const fetchCategory = selectedSector && themesCategory === 'Sector' ? 'Industry' : catType;
                const res = await fetch(`${API}/themes/stocks?category=${fetchCategory}&name=${encodeURIComponent(name)}`);
                const json = await res.json();
                themeStockData = json.data;
                // Show sort controls
                document.getElementById('sort-controls').style.display = 'flex';
                renderThemeStocksGrid(themeStockData, name);
            } catch (err) {
                console.error(err);
                area.innerHTML = `<div style="padding:40px;text-align:center;color:#ef4444;">Failed to load stocks for ${name}</div>`;
            }
        };

        function renderThemeStocksGrid(stocks, name) {
            const area = document.getElementById('grid-area');
            let html = `
                <div class="breadcrumb-bar">
                    ${selectedSector ? `<span class="bc-link" onclick="themesLevel='top';renderThemesView();">All Sectors</span><span class="bc-sep">›</span><span class="bc-link" onclick="drillIntoSector('${selectedSector.replace(/'/g, "\\'")}')">` + selectedSector + `</span><span class="bc-sep">›</span>` : `<span class="bc-link" onclick="themesLevel='top';renderThemesView();">All ${themesCategory}s</span><span class="bc-sep">›</span>`}
                    <span class="bc-current">${name}</span>
                    <span style="margin-left:auto;color:var(--text-muted);font-size:0.8rem;">${stocks.length} stocks</span>
                </div>
            `;
            area.innerHTML = html;

            if (!stocks.length) {
                area.innerHTML += `<div style="padding:40px;text-align:center;color:var(--text-muted);">No stocks found in ${name}</div>`;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'chart-grid';
            area.appendChild(grid);

            // Re-use existing sort logic from scanner engine
            const sorted = sortResults(stocks);
            for (const stock of sorted) {
                createChartCard(stock, grid);
            }
        }

        // ── Init ─────────────────────────────────────────────────
        boot();
    </script>

</body>

</html>
