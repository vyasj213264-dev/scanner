<!DOCTYPE html>
<html>
<body>
<div id="tv_chart_container" style="height: 500px;"></div>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
  new TradingView.widget({
    "autosize": true,
    "symbol": "AAPL",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "container_id": "tv_chart_container",
    "studies": [
      { id: "MASimple@tv-basicstudies", inputs: { length: 10 } },
      { id: "MAExp@tv-basicstudies", inputs: { length: 5 } },
      { id: "MAExp@tv-basicstudies", inputs: { length: 21 } }
    ],
    "studies_overrides": {
        "moving average.sma line.color": "#FFFF00",
        "moving average.sma length": 10,
        "exponential moving average.ema line.color": "#FF0000"
    }
  });
</script>
</body>
</html>
