<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Watchlist — TradersChart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg: #050810;
            --surface: #0a0d18;
            --card: #0f1525;
            --border: #1a2540;
            --accent: #3b82f6;
            --green: #10b981;
            --red: #f43f5e;
            --text: #e2e8f5;
            --text-dim: #8b9ec0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 60px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .logo span {
            color: var(--text);
            font-weight: 400;
        }

        .view-controls {
            display: flex;
            gap: 8px;
            background: var(--bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--accent);
            color: white;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* ── Table View ── */
        .watchlist-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            margin: 32px 0 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 12px 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .ticker {
            font-weight: 700;
            color: white;
        }

        .price {
            font-family: monospace;
            font-weight: 600;
        }

        .change-up {
            color: var(--green);
        }

        .change-down {
            color: var(--red);
        }

        /* ── Chart View ── */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
            gap: 20px;
        }

        @media (max-width: 700px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .chart-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            height: 400px;
            width: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: var(--text-dim);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="logo pulse" style="margin-bottom: 12px; font-size: 2rem;">Traders<span>Chart</span></div>
        <div style="font-size: 0.9rem;">Initializing Magic Watchlist...</div>
    </div>

    <header class="header">
        <div class="logo">Traders<span>Chart</span> <span style="font-size: 0.8rem; margin-left: 8px; opacity: 0.5;">/
                TEST</span></div>
        <div class="view-controls">
            <button class="view-btn active" id="view-table" onclick="setView('table')">Table</button>
            <button class="view-btn" id="view-chart" onclick="setView('chart')">Charts</button>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-dim);">
            Updates every 60s
        </div>
    </header>

    <main class="main-content" id="content">
        <!-- Rendered by JS -->
    </main>

    <script>
        let currentView = 'table';
        let watchlistData = [];

        async function fetchData() {
            try {
                const res = await fetch('/api/v1/magic/test');
                if (!res.ok) throw new Error('Failed to fetch data');
                watchlistData = await res.json();
                render();
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                console.error(err);
            }
        }

        function setView(view) {
            currentView = view;
            document.getElementById('view-table').classList.toggle('active', view === 'table');
            document.getElementById('view-chart').classList.toggle('active', view === 'chart');
            render();
        }

        function render() {
            const container = document.getElementById('content');

            if (watchlistData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 100px; color: var(--text-dim);">Watchlist is empty. Push some tickers to /api/v1/magic/test</div>';
                return;
            }

            if (currentView === 'table') {
                renderTable(container);
            } else {
                renderCharts(container);
            }
        }

        function renderTable(container) {
            let html = '<div class="watchlist-container">';
            watchlistData.forEach(section => {
                html += `
                    <div class="section-header">${section.section}</div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ticker</th>
                                    <th>Price</th>
                                    <th>Change %</th>
                                    <th>RS Rating</th>
                                    <th>Volume Brk</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                section.stocks.forEach(s => {
                    const price = s.Price || 0;
                    const change = s.Pct_Change || 0;
                    const cls = change >= 0 ? 'change-up' : 'change-down';
                    html += `
                        <tr>
                            <td class="ticker">${s.Ticker}</td>
                            <td class="price">$${price.toFixed(2)}</td>
                            <td class="${cls}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</td>
                            <td><span style="background:var(--card); padding:2px 8px; border-radius:4px; font-weight:700; color:var(--accent);">${s.RS_Rating || '--'}</span></td>
                            <td style="color:var(--text-dim)">${s.RVOL?.toFixed(1) || '--'}x</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderCharts(container) {
            container.innerHTML = '<div class="chart-grid" id="chart-grid"></div>';
            const grid = document.getElementById('chart-grid');

            watchlistData.forEach(section => {
                section.stocks.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'chart-card';
                    card.innerHTML = `
                        <div class="chart-header">
                            <div>
                                <span class="ticker" style="font-size:1.1rem">${s.Ticker}</span>
                                <span style="font-size:0.7rem; color:var(--text-dim); margin-left:8px;">${section.section}</span>
                            </div>
                            <div style="font-size:0.85rem; font-weight:600;">$${s.Price?.toFixed(2) || '--'}</div>
                        </div>
                        <div class="chart-container" id="chart-${s.Ticker}-${section.section.replace(/\s/g, '-')}"></div>
                    `;
                    grid.appendChild(card);

                    new TradingView.widget({
                        "width": "100%",
                        "height": 400,
                        "symbol": s.Ticker,
                        "interval": "D",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "allow_symbol_change": false,
                        "container_id": `chart-${s.Ticker}-${section.section.replace(/\s/g, '-')} `,
                        "hide_side_toolbar": true,
                        "save_image": false
                    });
                });
            });
        }

        // Init
        fetchData();
        setInterval(fetchData, 60000); // Poll every minute
    </script>
</body>

</html>
