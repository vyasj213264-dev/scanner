name: Portfolio Simulator Engine

on:
  workflow_dispatch: # Allows manual trigger from API

jobs:
  run-simulator:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Portfolio Simulation Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from api.services.portfolio_engine import run_all_variants, store_results
          try:
              results = run_all_variants()
              if results:
                  store_results(results)
                  print('✅ Successfully completed and stored parallel simulation variants.')
              else:
                  print('⚠️ Simulation ran but yielded no results')
          except Exception as e:
              import traceback
              print(f'❌ FATAL ERROR:\\n{traceback.format_exc()}')
              exit(1)
          "
