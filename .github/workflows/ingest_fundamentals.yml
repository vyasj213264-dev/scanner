name: Weekly Fundamentals Ingestion (IN)

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC (Saturday 11:00 PM Seattle / PDT)
    - cron: '0 6 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fundamentals ingestion (Indian Market)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingest_fundamentals.py --market IN
